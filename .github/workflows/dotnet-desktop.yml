name: SyrlasStudio MAUI CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            framework: net10.0-windows10.0.19041.0
          - os: macos-latest
            framework: net10.0-maccatalyst

    runs-on: ${{ matrix.os }}

    env:
      App_Project_Path: SyrlasStudio/SyrlasStudio/SyrlasStudio.csproj

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Select Xcode 27.1
      if: runner.os == 'macOS'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.1'

    - name: Install .NET MAUI Workload
      run: dotnet workload install maui

    - name: Restore MAUI App
      run: dotnet restore ${{ env.App_Project_Path }}

    - name: Build and Publish MAUI App
      run: dotnet publish ${{ env.App_Project_Path }} -c Release -f ${{ matrix.framework }} --no-restore

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SyrlasStudio-App-${{ matrix.os }}
        path: |
          SyrlasStudio/SyrlasStudio/bin/Release/**/*.exe
          SyrlasStudio/SyrlasStudio/bin/Release/**/*.app
          SyrlasStudio/SyrlasStudio/bin/Release/**/*.pkg
          SyrlasStudio/SyrlasStudio/bin/Release/**/*.zip
