# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Desktop & Mobile
"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Setup Xcode (macOS)
      if: startsWith(matrix.os, 'macos')
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6.0' # Исправлено с недоступной 27.1 на актуальную стабильную версию

    - name: Install .NET MAUI Workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore SyrlasStudio.sln

    - name: Build solution
      run: dotnet build SyrlasStudio.sln -c Release