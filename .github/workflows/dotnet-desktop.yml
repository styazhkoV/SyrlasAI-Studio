# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Build Desktop & Mobile"
"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.318'

    - name: Setup Xcode (macOS)
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'

    - name: Install .NET MAUI Workload
      run: dotnet workload install maui --version 9.0.202

    - name: Restore dependencies
      run: dotnet restore SyrlasStudio.sln

    - name: Build solution
      run: dotnet build SyrlasStudio.sln -c Release